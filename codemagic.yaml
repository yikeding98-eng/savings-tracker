workflows:
  # 路线一：免费 Apple ID 侧载（不含主屏幕小组件，小组件需要 App Group）
  # 已经有 p12 的话不用走这条，直接用下面的 ios-testflight。
  ios-personal:
    name: iOS 未签名 IPA（配 Sideloadly / AltStore 自签安装）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.personal.savingsTracker
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Analyze
        script: |
          flutter analyze || echo "analyze warnings ignored"
      - name: Build unsigned iOS release
        script: |
          set -e
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          rm -rf Payload SavingsTracker.ipa
          mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry SavingsTracker.ipa Payload
          ls -lh SavingsTracker.ipa
    artifacts:
      - build/ios/iphoneos/SavingsTracker.ipa
      - build/ios/iphoneos/Runner.app

  # 路线二：带主屏幕小组件 + 已签名 + 自动上传 TestFlight
  # 需要：$99 开发者账号、p12、两个 App Store 描述文件（主 App + 小组件）
  # 小组件的 target 由 ios/scripts/add_widget_target.rb 在云端自动注入，不需要 Mac。
  # 完整步骤见 docs/小组件配置步骤.md
  ios-testflight:
    name: iOS 带小组件 · 已签名 · 上传 TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: savings_key
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier:
          - com.personal.savingsTracker
          - com.personal.savingsTracker.SavingsWidget
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Prepare build numbers
        script: |
          # 构建号每次必须唯一；扩展的 Info.plist 用的是同一个值（主 App 和扩展版本不一致会被 App Store Connect 拒收）
          echo "WIDGET_BUILD_NUMBER=$(date +%s)" >> $CM_ENV
          echo "WIDGET_VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)" >> $CM_ENV
      - name: Register widget extension target
        script: |
          # 用脚本把小组件注册进 Xcode 工程，省掉租 Mac 手工建 target
          gem install xcodeproj --no-document
          ruby ios/scripts/add_widget_target.rb
      - name: Apply provisioning profiles
        script: |
          # testFlightInternalTestingOnly：只发给内部测试员，跳过 Apple 的 Beta 审核
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$WIDGET_BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
