workflows:
  # 路线一：免费 Apple ID 侧载（不含主屏幕小组件，小组件需要 App Group）
  # 已经有 p12 的话不用走这条，直接用下面的 ios-testflight。
  ios-personal:
    name: iOS 未签名 IPA（配 Sideloadly / AltStore 自签安装）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.personal.savingsTracker
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Analyze
        script: |
          flutter analyze || echo "analyze warnings ignored"
      - name: Build unsigned iOS release
        script: |
          set -e
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          rm -rf Payload SavingsTracker.ipa
          mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry SavingsTracker.ipa Payload
          ls -lh SavingsTracker.ipa
    artifacts:
      - build/ios/iphoneos/SavingsTracker.ipa
      - build/ios/iphoneos/Runner.app

  # 路线二：已签名 + 自动上传 TestFlight（有自己的 p12 / 付费开发者账号就选这条）
  # 使用前必须做三件事，详见 docs/TestFlight上线步骤.md：
  #   1. App Store Connect 里建好 App 记录（Bundle ID: com.personal.savingsTracker）
  #   2. Codemagic → Teams → Integrations → Developer Portal 里添加 App Store Connect API Key，
  #      名字必须叫 savings_key（和下面 integrations 里的一致）
  #   3. Codemagic → App → Settings → Code signing identities 里上传 p12 + App Store 描述文件
  ios-testflight:
    name: iOS 已签名并上传 TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: savings_key
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.personal.savingsTracker
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Apply provisioning profiles
        script: |
          # testFlightInternalTestingOnly：只发给内部测试员，跳过 Apple 的 Beta 审核
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build IPA
        script: |
          # 每次上传的 build number 必须唯一，用时间戳保证不会撞车
          flutter build ipa --release \
            --build-number=$(date +%s) \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
